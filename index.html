<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>OS Quest — TCSS 422 Study Game</title>
<meta name="description" content="A mixed-format study game for Operating Systems: processes, scheduling, concurrency, and more." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕹️</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css?v=13" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">🖥️</span>
        <span class="brand-text">OS Quest</span>
      </div>
      <nav class="topbar-actions">
        <span id="profile-badge" class="profile-badge"></span>
        <button id="btn-switch-user" class="ghost-btn" title="Switch player / add a new profile">🔁 Switch</button>
        <button id="btn-export" class="ghost-btn" title="Get a sync code to load your progress on another device">💾 Export</button>
        <button id="btn-notes" class="ghost-btn" title="Study notes for every topic">📝 Notes</button>
        <button id="btn-readings" class="ghost-btn" title="Readings & review suggestions">📖 Readings</button>
        <button id="btn-reset-progress" class="ghost-btn" title="Reset YOUR progress only">Reset My Progress</button>
      </nav>
    </header>

    <main id="view-root" class="view-root">
      <!-- hub or module view gets mounted here -->
    </main>

    <footer class="footer">
      <span>TCSS 422 · Operating Systems</span>
    </footer>
  </div>

  <script type="module" src="js/app.js?v=13"></script>
</body>
</html>
